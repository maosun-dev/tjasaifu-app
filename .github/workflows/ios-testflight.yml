# iPhone版をGitHubのMacで組み立てて、TestFlightに送る。
# GitHubのリポジトリの「Actions」タブ →「iPhone版をTestFlightへ」→「Run workflow」で動く。
#
# 必要な Secrets（Settings → Secrets and variables → Actions）:
#   APPLE_TEAM_ID              Appleのチーム ID（10文字）
#   APPSTORE_API_KEY_ID        App Store Connect API キーの Key ID
#   APPSTORE_API_ISSUER_ID     App Store Connect API キーの Issuer ID
#   APPSTORE_API_PRIVATE_KEY   ダウンロードした AuthKey_XXXX.p8 の中身（全文）
name: iPhone版をTestFlightへ

on:
  workflow_dispatch:
    inputs:
      runner:
        description: '組み立てに使う Mac（新しいチップの Mac は混んでいて始まらないことがある）'
        type: choice
        options: [macos-15-intel, macos-latest]
        default: macos-15-intel

permissions:
  contents: read

jobs:
  testflight:
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 60
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: アプリのファイルを入れる
        run: |
          npm ci
          npm test
          npm run build
          npx cap sync ios

      - name: App Store Connect の鍵を置く
        env:
          PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$PRIVATE_KEY" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" >> "$GITHUB_ENV"

      # ここでは署名しない（署名すると開発用の証明書が要り、それには iPhone の登録が要る）。
      # 配布用の署名は次の「TestFlight に送る」で付ける。
      - name: アプリを組み立てる（archive）
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}
          # 署名なしの部品は送るときに署名し直されないので、仮の署名を付けておく（送るときに配布用に置き換わる）
          find "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app/Frameworks" -maxdepth 1 -name '*.framework' \
            -exec codesign --force --sign - --timestamp=none {} \;

      - name: TestFlight に送る
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: 鍵を消す
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
